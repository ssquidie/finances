services:
  - type: web
    name: finances
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn finances.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: finances-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: finances-db
    plan: free
