{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finances</title>
<link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
<style>
  :root { color-scheme: dark; }
  body { font-family: monospace; max-width: 430px; margin: 0 auto; background: #1B1F27; color: #E8E6DE; font-size: 17px; }
  @media (min-width: 700px) {
    body { max-width: 640px; font-size: 18px; }
  }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid #3A4152; }
  header a { text-decoration: none; color: #E8E6DE; font-weight: bold; font-size: 20px; }
  #menu-btn { cursor: pointer; font-size: 26px; background: none; border: none; color: #E8E6DE; }
  #menu { display: none; position: absolute; right: 20px; top: 55px; background: #242938; border: 1px solid #3A4152; padding: 10px; z-index: 10; }
  #menu.open { display: block; }
  #menu a { display: block; padding: 10px 6px; color: #E8E6DE; text-decoration: none; font-size: 16px; }
  main { padding: 24px; }
  label { display: block; font-size: 13px; text-transform: uppercase; color: #9AA0AC; margin-top: 16px; }
  input, select { width: 100%; height: 48px; padding: 0 12px; margin-top: 6px; font-family: monospace; font-size: 17px; box-sizing: border-box; background: #242938; color: #E8E6DE; border: 1px solid #3A4152; }
  button[type=submit] { margin-top: 18px; background: #D85A30; color: #1B1F27; border: none; padding: 13px 20px; cursor: pointer; font-weight: bold; font-size: 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #3A4152; padding: 8px 0; }
  .row-right { display: flex; align-items: center; gap: 8px; }
  .edit-link { font-size: 11px; color: #9AA0AC; text-decoration: underline; }
  .week-header { display: flex; justify-content: space-between; align-items: center; padding: 14px; margin-top: 12px; cursor: pointer; border: none; width: 100%; font-family: monospace; font-size: 16px; text-align: left; color: #E8E6DE; }
  .arrow { display: inline-block; margin-left: 8px; transition: transform 0.15s ease; }
  .week-header.open .arrow { transform: rotate(180deg); }
  .week-body { display: none; padding: 4px 10px; }
  .week-body.open { display: block; }
  .stat { border: 1px solid #3A4152; background: #242938; padding: 14px 16px; margin-top: 12px; }
  .stat span { display: block; font-size: 12px; color: #9AA0AC; text-transform: uppercase; }
  summary { cursor: pointer; background: #F2994A; color: #1B1F27; padding: 10px; font-family: monospace; font-size: 14px; font-weight: bold; }
  details[open] summary { margin-bottom: 4px; }
  .dash-stat { display: flex; flex-direction: column; padding: 12px 14px; margin-top: 10px; border-left: 4px solid; background: #242938; }
  .dash-label { font-size: 11px; text-transform: uppercase; color: #9AA0AC; letter-spacing: 0.04em; margin-bottom: 4px; }
  .dash-value { font-size: 26px; font-weight: bold; }
  .dash-value-text { font-size: 15px; font-weight: normal; color: #E8E6DE; }
  .accent-coral { border-color: #E8724A; }
  .accent-coral .dash-value { color: #E8724A; }
  .accent-teal { border-color: #3BC79A; }
  .accent-teal .dash-value { color: #3BC79A; }
  .accent-red { border-color: #E85B52; }
  .accent-red .dash-value { color: #E85B52; }
  .accent-amber { border-color: #E0A63C; }
  .accent-amber .dash-value { color: #E0A63C; }
  .accent-purple { border-color: #A79CF0; }
  .accent-purple .dash-value { color: #A79CF0; }
  .donut-wrap { display: flex; justify-content: center; margin-top: 8px; margin-bottom: 4px; }
  .toggle-btn { background: #242938; color: #E8E6DE; border: 1px solid #3A4152; padding: 12px 14px; cursor: pointer; font-family: monospace; font-size: 15px; white-space: nowrap; margin-top: 6px; }
  .dash-btn { text-decoration: none; cursor: pointer; }
  dialog { background: #1B1F27; color: #E8E6DE; border: 1px solid #3A4152; max-width: 380px; width: 90vw; padding: 20px; font-family: monospace; }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog label { display: block; font-size: 12px; text-transform: uppercase; color: #9AA0AC; margin-top: 12px; }
  dialog input, dialog select { width: 100%; height: 42px; padding: 0 10px; margin-top: 4px; font-family: monospace; font-size: 15px; box-sizing: border-box; background: #242938; color: #E8E6DE; border: 1px solid #3A4152; }
  dialog button[type=submit] { width: 100%; margin-top: 14px; }
  .week-header.month-1 { background: #2A3A4A; }
  .week-header.month-2 { background: #2C2A4A; }
  .week-header.month-3 { background: #372A4A; }
  .week-header.month-4 { background: #4A2A3E; }
  .week-header.month-5 { background: #4A2A2A; }
  .week-header.month-6 { background: #4A342A; }
  .week-header.month-7 { background: #4A3E2A; }
  .week-header.month-8 { background: #454A2A; }
  .week-header.month-9 { background: #374A2A; }
  .week-header.month-10 { background: #2A4A34; }
  .week-header.month-11 { background: #2A4A42; }
  .week-header.month-12 { background: #2A424A; }
</style>
</head>
<body>
<header>
  <a href="{% url 'entry' %}" style="display: flex; align-items: center; gap: 10px;">
    <img src="{% static 'favicon.png' %}" alt="" width="26" height="26" style="border-radius: 6px;">
    Finances
  </a>
  {% if user.is_authenticated %}
  <div style="position: relative;">
    <button id="menu-btn" onclick="document.getElementById('menu').classList.toggle('open')">&#9776;</button>
    <div id="menu">
      <a href="{% url 'entry' %}">Log spending</a>
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'weekly' %}">Weekly spending</a>
      <a href="{% url 'income' %}">Income</a>
      <a href="{% url 'logout' %}">Log out</a>
    </div>
  </div>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
function toggleWeek(bodyId, hdrId) {
  document.getElementById(bodyId).classList.toggle('open');
  document.getElementById(hdrId).classList.toggle('open');
}
function togglePw(id, btn) {
  var el = document.getElementById(id);
  if (el.type === 'password') { el.type = 'text'; btn.textContent = 'Hide'; }
  else { el.type = 'password'; btn.textContent = 'Show'; }
}
</script>
</body>
</html>
